[package]
name = "hcbs_test_suite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.6.0", features = ["derive"] }
ctrlc = "3.5.2"
nom = "8.0.0"
rand = "0.10.0"
crossbeam = "0.8.4"
eva-rt-engine = { git = "https://github.com/Yurand2000/EVA-rt-Engine" }
libtux = { git = "https://github.com/Yurand2000/libtux", tag = "version-0.1.1", default-features = false, features = [
    "cpuset",
    "time",
    "time_extra",
    "time_iterators",
    "sched",
    "signal",
    "serde",
    "parser",
] }
env_logger = "0.11.10"
graphviz-rust = "0.9.8"
log = "0.4.34"
libc = "0.2.190"

[[bin]]
name = "regression"
path = "src/bin/regression/main.rs"

[[bin]]
name = "constraints"
path = "src/bin/constraints/main.rs"

[[bin]]
name = "stress"
path = "src/bin/stress/main.rs"

[[bin]]
name = "time"
path = "src/bin/time/main.rs"

[[bin]]
name = "taskset"
path = "src/bin/taskset/main.rs"

[[bin]]
name = "tools"
path = "src/bin/tools/main.rs"

[[bin]]
name = "taskset_gen"
path = "src/bin/taskset_gen/main.rs"
